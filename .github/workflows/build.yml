# https://github.com/actions/runner-images

name: Build

on: [push]

jobs:
  macos_26_tahoe:
    name: macOS 26 Tahoe
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          PATH=$PATH:$PWD
          mkdir build
          cd build
          cmake .. -G Xcode -DUNITS=1
          cmake --build .
      - name: Test
        run: build/Debug/units
